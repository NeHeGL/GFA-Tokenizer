name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
      whats_new:
        description: "What's new in this version (Markdown, e.g. bullet points). Shown at the top of the release notes."
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Create and push tag
        run: |
          git tag ${{ inputs.version }}
          git push origin ${{ inputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python -m PyInstaller "GFA Tokenizer.spec" --noconfirm

      - name: Package release zip
        shell: pwsh
        run: |
          $zipName = "GFA-Tokenizer-${{ inputs.version }}-windows-x64.zip"
          Compress-Archive -Path "dist\GFA Tokenizer.exe", README.md -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Build release notes
        shell: pwsh
        env:
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          $notes = @()
          if ($env:WHATS_NEW.Trim() -ne "") {
            $notes += "### What's New in ${{ inputs.version }}"
            $notes += $env:WHATS_NEW
            $notes += ""
            $notes += "---"
            $notes += ""
          }
          $notes += "Pre-built Windows binary for GFA Tokenizer. Source code is available separately in the repository."
          $notes += ""
          $notes += "### Installation"
          $notes += "1. Download ``GFA-Tokenizer-${{ inputs.version }}-windows-x64.zip``"
          $notes += "2. Extract and run ``GFA Tokenizer.exe`` — no installation required."
          $notes += ""
          $notes += "### Requirements"
          $notes += "- Windows 10/11 x64"
          $notes += ""
          $notes += "### Usage"
          $notes += "- **GUI:** Double-click ``GFA Tokenizer.exe``, browse to your .lst file, click Convert"
          $notes += "- **CLI:** ``""GFA Tokenizer.exe"" source.lst [-o out.gfa]``"
          $notes -join "`n" | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ inputs.version }}
          name: "GFA Tokenizer ${{ inputs.version }}"
          body_path: RELEASE_NOTES.md
          files: ${{ env.ZIP_NAME }}
